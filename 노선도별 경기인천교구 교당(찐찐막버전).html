document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,255,.2); }\n  .lrow .cnt { cursor: pointer; }\n  .lrow .cnt:hover { background: #9fc4ee; color: #12305c; }\n  #modal { display: none; position: fixed; inset: 0; z-index: 40;\n    background: rgba(12,30,58,.55); align-items: center; justify-content: center; }\n  .sheet { width: 460px; max-width: calc(100vw - 40px); max-height: 78vh; display: flex;\n    flex-direction: column; background: #fff; color: #1b2430; border-radius: 24px;\n    box-shadow: 0 24px 60px rgba(10,24,48,.4); overflow: hidden; }\n  .shead { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 800;\n    padding: 18px 20px 14px; border-bottom: 1px solid #e6ecf5; }\n  .shead .bar { width: 22px; height: 6px; border-radius: 999px; }\n  .shead .cnt { font-size: 12px; font-weight: 700; color: #4a628a;\n    background: #eef3fa; border-radius: 999px; padding: 3px 9px; }\n  #mclose { margin-left: auto; border: 0; background: transparent; color: #4a628a;\n    font-size: 15px; font-weight: 800; cursor: pointer; border-radius: 999px; padding: 4px 9px; }\n  #mclose:hover { background: #eef3fa; }\n  #mbody { overflow: auto; padding: 6px 20px 18px; }\n  .mrow { padding: 12px 0; border-bottom: 1px solid #f0f4f9; }\n  .mrow:last-child { border-bottom: 0; }\n  .mname { font-size: 15px; font-weight: 800; }\n  .mmeta { font-size: 12.5px; font-weight: 700; color: #3f6ca8; margin-top: 2px; }\n  .maddr { font-size: 12.5px; color: #6b7c93; margin-top: 2px; }\n  .mblog { display: inline-flex; margin-top: 7px; margin-right: 6px; white-space: nowrap;\n    font-size: 12px; font-weight: 800;\n    text-decoration: none; color: #1e4272; background: #e8f0fa; border: 1px solid #cfdff2;\n    border-radius: 999px; padding: 4px 11px; }\n  .mblog:hover { background: #d9e7f7; color: #12305c; }\n  .lrow .bar { width: 20px; height: 5px; border-radius: 999px; flex: 0 0 auto; }\n  .lrow .cnt { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #cfe1f6;\n    background: rgba(255,255,255,.14); border-radius: 999px; padding: 2px 7px; }\n  .mapcard { position: relative; background: #fff; border-radius: 24px; overflow: hidden;\n    height: calc(100vh - 16px); }\n  svg { display: block; width: 100%; height: 100%; }\n  .stname { font-size: 5.4px; font-weight: 600; fill: #55688a; pointer-events: none; }\n  .chlabel { cursor: pointer; }\n  .chlabel:hover .ch { fill: #c0392b; }\n  .chlabel .st { font-size: 15px; font-weight: 700; fill: #4a628a; }\n  .chlabel .ch { font-size: 20px; font-weight: 800; fill: #12305c; }\n  .leader { stroke: #9fb0c9; stroke-width: 1.4; }\n  .zoomctl { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 7px; }\n  .zoomctl button { width: 34px; height: 34px; border-radius: 999px; border: 1px solid #dbe4f0;\n    background: #fff; color: #1e4272; font-size: 15px; font-weight: 800; cursor: pointer; }\n  .foot { position: absolute; left: 258px; bottom: 16px; font-size: 12px; color: #7d97ba; }\n  #tip { position: fixed; pointer-events: none; opacity: 0; transition: opacity 120ms ease;\n    background: #fff; color: #1b2430; box-shadow: 0 18px 46px rgba(16,32,58,.24); border-radius: 16px;\n    padding: 11px 13px; font-size: 12.5px; line-height: 1.5; max-width: 270px; z-index: 30; }\n  a { color: #9fc4ee; }\n  a:hover { color: #cfe1f6; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n  <aside>\n    <div style=\"display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;font-size:12.5px;white-space:nowrap\"><\u002Fdiv>\n    <div class=\"kicker\">원기 111년 · 경기인천교구<\u002Fdiv>\n    <div class=\"stats\">\n      <div class=\"stat\"><b>44<\u002Fb><span>교당<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>3<\u002Fb><span>기관교당<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel\">\n      <div class=\"sechead\">노선별 교당 수<\u002Fdiv>\n      <div id=\"lines\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n  <div class=\"mapcard\">\n    <svg id=\"map\"><\u002Fsvg>\n    <div class=\"foot\">교당 인접역만 역명 표기 · 그 외 역은 점으로만 표시<\u002Fdiv>\n    <div class=\"zoomctl\">\n      <button id=\"zin\" title=\"확대\">＋<\u002Fbutton>\n      <button id=\"zout\" title=\"축소\">－<\u002Fbutton>\n      <button id=\"zreset\" title=\"처음으로\">↺<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div id=\"tip\"><\u002Fdiv>\n<div id=\"modal\">\n  <div class=\"sheet\">\n    <div class=\"shead\"><span id=\"mtitle\" style=\"display:flex;align-items:center;gap:9px\"><\u002Fspan>\n      <button id=\"mclose\">닫기<\u002Fbutton><\u002Fdiv>\n    <div id=\"mbody\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script type=\"module\">\nconst R = window.__resources || {};\nconst [S, CHURCHES] = await Promise.all([\n  fetch(R.schematic || './schematic.json').then(r => r.json()),\n  fetch(R.churches || './churches.json').then(r => r.json())\n]);\n\nconst U = 15;\nconst svg = d3.select('#map');\nconst root = svg.append('g');\nconst X = v => v * U, Y = v => v * U;\n\nconst disp = c => c.pair ? c.name + '·' + c.pair : c.name;\nconst blogPills = c => (c.blogs\n  ? c.blogs.map(b => `<a href=\"${b.url}\" target=\"_blank\" rel=\"noopener\" class=\"mblog\">${b.label} →<\u002Fa>`).join('')\n  : (c.blog ? `<a href=\"${c.blog}\" target=\"_blank\" rel=\"noopener\" class=\"mblog\">블로그 →<\u002Fa>` : '')\n    + (c.extra ? `<a href=\"${c.extra.url}\" target=\"_blank\" rel=\"noopener\" class=\"mblog\">${c.extra.label} →<\u002Fa>` : ''));\nconst byName = new Map(S.stations.map(s => [s.n, s]));\nconst chByStation = new Map();\nCHURCHES.forEach(c => {\n  const k = c.station.replace(/역$/, '');\n  if (!chByStation.has(k)) chByStation.set(k, []);\n  chByStation.get(k).push(c);\n});\n\n// 노선\nconst lineG = root.append('g').attr('fill', 'none')\n  .attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');\nconst lineOf = d3.line().x(d => X(d[0])).y(d => Y(d[1]));\nS.lines.forEach(l => {\n  lineG.append('path').datum(l).attr('class', 'lpath')\n    .attr('d', lineOf(l.poly)).attr('stroke', l.color).attr('stroke-width', 5.5);\n});\n\n// 일반역\nconst plain = S.stations.filter(s => !chByStation.has(s.n));\nroot.append('g').selectAll('circle').data(plain).join('circle')\n  .attr('cx', d => X(d.x)).attr('cy', d => Y(d.y))\n  .attr('r', d => d.tr ? 2.6 : 1.7)\n  .attr('fill', '#fff').attr('stroke', '#7f93b3').attr('stroke-width', d => d.tr ? 1.2 : 0.9);\n\n// 교당 인접역\nconst chStations = S.stations.filter(s => chByStation.has(s.n));\nroot.append('g').selectAll('circle').data(chStations).join('circle')\n  .attr('cx', d => X(d.x)).attr('cy', d => Y(d.y)).attr('r', 4.6)\n  .attr('fill', '#fff').attr('stroke', '#12305c').attr('stroke-width', 2);\n\n// 노선 지나가는 지점 회피를 위해 선분 목록 생성\nconst segs = [];\nS.lines.forEach(l => {\n  for (let i = 1; i < l.poly.length; i++)\n    segs.push([X(l.poly[i-1][0]), Y(l.poly[i-1][1]), X(l.poly[i][0]), Y(l.poly[i][1])]);\n});\nconst segHitsBox = (s, b) => {\n  const [x1, y1, x2, y2] = s;\n  const inside = (x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;\n  if (inside(x1, y1) || inside(x2, y2)) return true;\n  const cross = (ax, ay, bx, by, cx, cy, dx, dy) => {\n    const d1 = (bx-ax)*(cy-ay)-(by-ay)*(cx-ax), d2 = (bx-ax)*(dy-ay)-(by-ay)*(dx-ax);\n    const d3 = (dx-cx)*(ay-cy)-(dy-cy)*(ax-cx), d4 = (dx-cx)*(by-cy)-(dy-cy)*(bx-cx);\n    return ((d1>0)!==(d2>0)) && ((d3>0)!==(d4>0));\n  };\n  const c = [[b.x,b.y,b.x+b.w,b.y],[b.x+b.w,b.y,b.x+b.w,b.y+b.h],\n             [b.x+b.w,b.y+b.h,b.x,b.y+b.h],[b.x,b.y+b.h,b.x,b.y]];\n  return c.some(e => cross(x1,y1,x2,y2,e[0],e[1],e[2],e[3]));\n};\nconst nearSegs = b => segs.filter(s =>\n  Math.max(s[0],s[2]) >= b.x - 4 && Math.min(s[0],s[2]) <= b.x + b.w + 4 &&\n  Math.max(s[1],s[3]) >= b.y - 4 && Math.min(s[1],s[3]) <= b.y + b.h + 4);\n\n// 라벨: 역명 + 교당명 (오른쪽 기본, 오른쪽이 붐비면 왼쪽)\nconst boxes = [];\nconst overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;\nconst labels = chStations.map(s => {\n  const names = chByStation.get(s.n).map(disp);\n  const text = names.join('·');\n  const w = Math.max((s.n.length + 1) * 15, text.length * 20) + 10, h = 42;\n  const cands = [];\n  for (const r of [15, 42, 74, 108, 146]) for (const [ux, uy] of [[1,-0.35],[-1,-0.35],[1,0.95],[-1,0.95],[0.15,-1.25],[0.15,1.5],[1,-1.25],[-1,1.5],[1,0.3],[-1,0.3]])\n    cands.push({ dx: ux * r, dy: uy * r, anchor: ux < 0 ? 'end' : 'start' });\n  let use = null, best = null;\n  for (const c of cands) {\n    const bx = X(s.x) + c.dx - (c.anchor === 'end' ? w : 0);\n    const box = { x: bx, y: Y(s.y) + c.dy - 18, w, h };\n    if (boxes.some(b => overlaps(b, box))) continue;\n    const hits = nearSegs(box).filter(sg => segHitsBox(sg, box)).length;\n    if (hits === 0) { use = c; boxes.push(box); break; }\n    if (!best || hits < best.hits) best = { c, box, hits };\n  }\n  if (!use) { use = (best || { c: cands[0] }).c; if (best) boxes.push(best.box); }\n  return { s, names, text, use, w };\n});\nroot.append('g').selectAll('line').data(labels.filter(d => Math.hypot(d.use.dx, d.use.dy) > 22))\n  .join('line').attr('class', 'leader')\n  .attr('x1', d => X(d.s.x)).attr('y1', d => Y(d.s.y))\n  .attr('x2', d => X(d.s.x) + d.use.dx * 0.8).attr('y2', d => Y(d.s.y) + d.use.dy * 0.8);\nconst lg = root.append('g').selectAll('g').data(labels).join('g').attr('class', 'chlabel')\n  .attr('transform', d => `translate(${X(d.s.x) + d.use.dx},${Y(d.s.y) + d.use.dy})`)\n  .attr('text-anchor', d => d.use.anchor);\nlg.append('text').attr('class', 'st').text(d => d.s.n + '역');\nlg.append('text').attr('class', 'ch').attr('dy', '1.22em').text(d => d.text);\n\n// 내용 크기에 맞춘 viewBox\n{\n  const xs = S.stations.map(s => X(s.x)), ys = S.stations.map(s => Y(s.y));\n  const pad = 90;\n  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;\n  const w = Math.max(...xs) - Math.min(...xs) + pad * 2;\n  const hh = Math.max(...ys) - Math.min(...ys) + pad * 2;\n  svg.attr('viewBox', `${x0} ${y0} ${w} ${hh}`);\n}\n\n// 확대·축소\nconst zoom = d3.zoom().scaleExtent([0.7, 10])\n  .translateExtent([[-4000, -4000], [8000, 8000]])\n  .on('zoom', e => root.attr('transform', e.transform));\nsvg.call(zoom).on('dblclick.zoom', null);\ndocument.getElementById('zin').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.6);\ndocument.getElementById('zout').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.6);\ndocument.getElementById('zreset').onclick = () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);\n\n// 노선 목록 (1호선 지선은 1호선으로 합산)\nconst merged = new Map();\nS.lines.forEach(l => {\n  const key = l.name.replace(/^1호선\\(.*\\)$/, '1호선');\n  if (!merged.has(key)) merged.set(key, { name: key, color: l.color, items: new Map(), parts: [] });\n  merged.get(key).parts.push(l);\n  l.stations.forEach(s => (chByStation.get(s) || []).forEach(c => merged.get(key).items.set(c.name, c)));\n});\nconst rows = [...merged.values()].filter(o => o.items.size).sort((a, b) => b.items.size - a.items.size);\ndocument.getElementById('lines').innerHTML = rows.map((o, i) =>\n  `<div class=\"lrow\" data-i=\"${i}\" role=\"button\" tabindex=\"0\"><span class=\"bar\" style=\"background:${o.color}\"><\u002Fspan>${o.name}\n   <span class=\"cnt\" data-count=\"${i}\" title=\"교당 목록 보기\">${o.items.size}<\u002Fspan><\u002Fdiv>`).join('');\n\n// 노선명 클릭 → 해당 노선 확대 · 교당 강조\nlet litRow = -1;\nconst focusLine = i => {\n  if (litRow === i) { resetFocus(); return; }\n  litRow = i;\n  const o = rows[i];\n  const names = new Set(o.parts.flatMap(l => l.stations));\n  const chNames = new Set([...o.items.keys()]);\n  root.selectAll('.lpath')\n    .transition().duration(420)\n    .attr('stroke-width', d => o.parts.includes(d) ? 9 : 4)\n    .attr('opacity', d => o.parts.includes(d) ? 1 : 0.16);\n  lg.transition().duration(420)\n    .attr('opacity', d => chNames.has(d.text.split('·')[0]) || names.has(d.s.n) ? 1 : 0.12)\n    .attr('transform', d => {\n      const on = names.has(d.s.n);\n      const k = on ? 1.35 : 1;\n      return `translate(${X(d.s.x) + d.use.dx},${Y(d.s.y) + d.use.dy}) scale(${k})`;\n    });\n  root.selectAll('circle').transition().duration(420)\n    .attr('opacity', d => d && names.has(d.n) ? 1 : 0.2)\n    .attr('r', d => d && chByStation.has(d.n) ? (names.has(d.n) ? 7.5 : 4.6) : (d && d.tr ? 2.6 : 1.7));\n  root.selectAll('.leader').transition().duration(420)\n    .attr('opacity', d => names.has(d.s.n) ? 1 : 0.12);\n  // 지도 확대 (해당 노선 순서에 맞춰 화면을 맞춘다)\n  const pts = o.parts.flatMap(l => l.poly.map(p => [X(p[0]), Y(p[1])]));\n  const vb = svg.attr('viewBox').split(' ').map(Number);\n  const x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0]));\n  const y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));\n  const pad = 130;\n  const k = Math.max(0.7, Math.min(6, Math.min(vb[2] / (x1 - x0 + pad * 2), vb[3] / (y1 - y0 + pad * 2))));\n  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;\n  const tx = vb[0] + vb[2] / 2 - k * cx, ty = vb[1] + vb[3] / 2 - k * cy;\n  svg.transition().duration(600)\n    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));\n  document.querySelectorAll('.lrow').forEach(el =>\n    el.classList.toggle('on', +el.dataset.i === i));\n};\nconst resetFocus = () => {\n  litRow = -1;\n  root.selectAll('.lpath').transition().duration(380).attr('stroke-width', 5.5).attr('opacity', 1);\n  lg.transition().duration(380).attr('opacity', 1)\n    .attr('transform', d => `translate(${X(d.s.x) + d.use.dx},${Y(d.s.y) + d.use.dy})`);\n  root.selectAll('circle').transition().duration(380).attr('opacity', 1)\n    .attr('r', d => d && chByStation.has(d.n) ? 4.6 : (d && d.tr ? 2.6 : 1.7));\n  root.selectAll('.leader').transition().duration(380).attr('opacity', 1);\n  svg.transition().duration(520).call(zoom.transform, d3.zoomIdentity);\n  document.querySelectorAll('.lrow').forEach(el => el.classList.remove('on'));\n};\ndocument.getElementById('zreset').addEventListener('click', () => { if (litRow >= 0) resetFocus(); });\n\n// 노선 클릭 → 교당 목록 팝업\nconst tip = document.getElementById('tip');\nconst modal = document.getElementById('modal');\nconst mBody = document.getElementById('mbody');\nconst mTitle = document.getElementById('mtitle');\nconst openLine = i => {\n  const o = rows[i];\n  mTitle.innerHTML = `<span class=\"bar\" style=\"background:${o.color}\"><\u002Fspan>${o.name}\n    <span class=\"cnt\">${o.items.size}곳<\u002Fspan>`;\n  mBody.innerHTML = [...o.items.values()]\n    .sort((a, b) => a.km - b.km)\n    .map(c => `<div class=\"mrow\">\n      <div class=\"mname\">${disp(c)}<\u002Fdiv>\n      <div class=\"mmeta\">${c.station} · 직선 ${c.km.toFixed(2)}km<\u002Fdiv>\n      <div class=\"maddr\">${c.addr || ''}<\u002Fdiv>\n      ${c.tel ? `<div class=\"maddr\">전화 ${c.tel}<\u002Fdiv>` : ''}\n      ${blogPills(c)}\n    <\u002Fdiv>`).join('');\n  modal.style.display = 'flex';\n};\ndocument.getElementById('lines').addEventListener('click', e => {\n  const badge = e.target.closest('.cnt');\n  if (badge) { openLine(+badge.dataset.count); return; }\n  const row = e.target.closest('.lrow');\n  if (row) focusLine(+row.dataset.i);\n});\ndocument.getElementById('lines').addEventListener('keydown', e => {\n  if (e.key !== 'Enter' && e.key !== ' ') return;\n  const row = e.target.closest('.lrow');\n  if (row) { e.preventDefault(); focusLine(+row.dataset.i); }\n});\nconst closeModal = () => { modal.style.display = 'none'; };\ndocument.getElementById('mclose').onclick = closeModal;\nmodal.addEventListener('click', e => { if (e.target === modal) closeModal(); });\nwindow.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });\n\n// 지도 상 교당명 라벨 — 호버 툴팁 · 클릭 시 동일한 팝업\nconst churchRow = c => `<div class=\"mrow\">\n  <div class=\"mname\">${disp(c)}<\u002Fdiv>\n  <div class=\"mmeta\">${c.station} · 직선 ${c.km.toFixed(2)}km<\u002Fdiv>\n  <div class=\"maddr\">${c.addr || ''}<\u002Fdiv>\n  ${c.tel ? `<div class=\"maddr\">전화 ${c.tel}<\u002Fdiv>` : ''}\n  ${blogPills(c)}\n<\u002Fdiv>`;\nconst showTipFor = (e, name) => {\n  const list = chByStation.get(name);\n  tip.innerHTML = `<b style=\"font-size:14px\">${name}역<\u002Fb>` + list.map(c =>\n    `<div style=\"margin-top:6px\"><b>${disp(c)}<\u002Fb><br>\n     <span style=\"opacity:.65\">${c.addr || ''}<br>직선 ${c.km.toFixed(2)}km<\u002Fspan><\u002Fdiv>`).join('');\n  tip.style.opacity = 1;\n  tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px';\n  tip.style.top = (e.clientY + 16) + 'px';\n};\nconst openStation = name => {\n  const list = chByStation.get(name);\n  const color = (S.lines.find(l => l.stations.includes(name)) || {}).color || '#1e4272';\n  tip.style.opacity = 0;\n  mTitle.innerHTML = `<span class=\"bar\" style=\"background:${color}\"><\u002Fspan>${name}역\n    <span class=\"cnt\">${list.length}곳<\u002Fspan>`;\n  mBody.innerHTML = list.map(churchRow).join('');\n  modal.style.display = 'flex';\n};\nlg.style('pointer-events', 'auto')\n  .on('mousemove', (e, d) => showTipFor(e, d.s.n))\n  .on('mouseleave', () => { tip.style.opacity = 0; })\n  .on('click', (e, d) => openStation(d.s.n));\n\n// 툴팁 (역 원)\nroot.selectAll('circle').filter(d => d && chByStation.has(d.n))\n  .style('cursor', 'pointer')\n  .on('mousemove', (e, d) => showTipFor(e, d.n))\n  .on('click', (e, d) => openStation(d.n))\n  .on('mouseleave', () => { tip.style.opacity = 0; });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
